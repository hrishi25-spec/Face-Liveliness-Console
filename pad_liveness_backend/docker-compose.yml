version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pad_liveness_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pad_liveness}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pad_liveness_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app

volumes:
  pg_data:
