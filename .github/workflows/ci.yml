name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Unit and integration suites run as two parallel jobs. Both jobs share the
# same checkout/JDK setup; the suite split is a surefire -Dtest filter, so no
# extra plugins or pom changes are needed.
on:
  push:
    # Every branch push runs the suites and builds the jar. Tag pushes (v*)
    # additionally publish a GitHub Release with both jars, the Linux .deb,
    # .rpm and AppImage, the Android harness APK, and a .sha256 beside every
    # one of them.
    branches: ['**']
    tags: ['v*']
  # Branches get the identical gate before merging — unit + integration
  # suites, the PostgreSQL schema gate, the console DOM tests and both jar
  # builds. A pull request publishes nothing: the upload step below is guarded
  # on event type, ref and default branch, so no fork can write to storage.
  pull_request:

# Least privilege by default: the workflow only needs to read the repo. The
# release job overrides this with contents: write, scoped to that one job.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Run both to completion — a unit failure must not cancel the
      # integration run (and vice versa); both results are wanted.
      fail-fast: false
      matrix:
        include:
          - suite: Unit
            # CrossBackendContractTest is excluded here on purpose: it needs the
            # Python backend's dependencies, which this job does not install,
            # so it would only ever skip. The *Cross-backend contract* job
            # exists to run it where that environment is real.
            maven_tests: "!LivenessPipelineIntegrationTest,!PostgresSchemaTest,!CrossBackendContractTest"
          - suite: Integration
            maven_tests: "LivenessPipelineIntegrationTest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 17 matches <java.version> in pom.xml and is the ceiling this test
      # stack supports: the Mockito/ByteBuddy pair Spring Boot 3.3.x manages
      # (byte-buddy 1.14.x) cannot instrument JDK 25 class files, so a JDK 25
      # runner fails every Mockito-backed slice with "Mockito cannot mock this
      # class" before an assertion runs — 231 errors on the last measurement,
      # none of them a real test failure. Raise this only together with those
      # dependencies. Maven caching keeps CI fast.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests are self-contained: the JPA slice swaps in embedded H2, OpenCV
      # natives and the ONNX model ship inside the dependency jars, so no
      # database or external service is needed on the runner. The desktop
      # overlay's smoke test is self-contained in the same way: surefire pins
      # JavaFX to Monocle's headless glass platform, so it renders cards
      # without a display, a window system or a GPU. The single quotes keep
      # the surefire '!' exclusion literal for the shell.
      - name: Run ${{ matrix.suite }} tests
        run: ./mvnw --batch-mode test -Dtest='${{ matrix.maven_tests }}'

      # A failed test is otherwise buried in a log only a maintainer signed in
      # to GitHub can read. Publish the failing class and its first assertion as
      # a check annotation, so the failure is visible from the checks API and
      # the PR page without downloading the raw log.
      - name: Report the failing test
        if: failure()
        run: |
          set -uo pipefail
          shopt -s nullglob
          reports=( target/surefire-reports/*.txt )
          found=0
          for report in "${reports[@]}"; do
            if ! grep -qE 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              continue
            fi
            found=1
            name=$(basename "$report" .txt)
            summary=$(grep -m1 -E '^Tests run:' "$report" || true)
            detail=$(sed -n '/<<< FAILURE/,+10p' "$report" | tr '\n' ' ' | cut -c1-800)
            echo "::error title=Failing test: $name::$summary $detail"
          done
          if [ "$found" = 0 ]; then
            echo "::error::Maven failed before writing a failing surefire report; the failure was not a test assertion (check the job log for a fork or build error)."
          fi

  # The console is plain browser JS with no build step, so its guards live
  # outside Maven entirely: a green Java suite says nothing about whether
  # src/main/resources/static is still wired. This runs the DOM harness that
  # executes the real index.html + console.js and drives the dirty marker,
  # the per-field diff, the discard guard and the unload warnings.
  console:
    name: Console DOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No setup-node and no npm install: the harness is deliberately
      # dependency-free, and ubuntu-latest ships a node binary on PATH.
      - name: Run the console guard tests
        run: node src/test/js/console-guards.test.mjs

  # Guidance and instruction scope. Nothing else in this workflow reads
  # AGENTS.md or the READMEs: a project can land with no guidance and no map
  # entry, and a paragraph copied from another project's README can tell
  # readers to edit files that do not exist in the tree they are in. Both have
  # shipped here, so the check exists now instead of in whoever notices next.
  #
  # Deliberately not a dependency of package/docker/release: a boundary
  # problem is a reason to fix the PR, not a reason to withhold a jar. Like
  # the console harness it needs no setup step — ubuntu-latest ships node, and
  # the script has no dependencies.
  boundaries:
    name: Project boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check project guidance and instruction scope
        run: node scripts/check-project-boundaries.mjs

  # Documentation links: `docs/` and the READMEs describe classes, migrations
  # and scripts by relative path, and nothing resolved those paths. A file that
  # moves leaves the link 404-ing while the prose still claims it is there, and
  # the reader concludes the whole document is stale. The gate resolves each
  # relative link from the file that contains it — the way a reader's browser
  # does, so `src/main/...` written from inside `docs/` is caught even though
  # the file exists at the root — and verifies `#heading` anchors against the
  # target's real headings. It checks the whole tree, including the sibling
  # projects' READMEs, and needs no network: external URLs are out of scope.
  docs-links:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check every relative documentation link resolves
        run: node scripts/check-doc-links.mjs

  # Java source layout: two gates over the same tree, both reading it as text so
  # neither needs Maven, a compiler, or a setup step (the scripts are
  # dependency-free and ubuntu-latest ships node).
  #
  # The import gate exists because a partial restore of `src/` is a failure mode
  # this repository has shipped: 0824f02 deleted the tree, the restore brought
  # back most of it but left thirteen classes behind, and Maven only found out
  # at compile time — attributing every error to the importing file, so the
  # deleted class looked like a broken consumer. That gate reads the imports and
  # names the missing class directly. The package gate covers the failure the
  # import gate cannot see: a file whose directory and package declaration
  # disagree still resolves by path, so the imports check stays green while
  # javac fails for every consumer.
  imports:
    name: Java source layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check every Java import resolves to a source file
        run: node scripts/check-java-imports.mjs

      - name: Check every Java package matches its directory
        run: node scripts/check-java-packages.mjs

  #
  # The secret scan. Nothing else here can catch a committed credential: the
  # Java suites, the schema gate and the console harness all read the code, and
  # a `.env`-shaped value compiles fine. gitleaks reads the Git history rather
  # than the working tree, so a secret that was committed and then removed still
  # fails until the history is rewritten — which is why the checkout is full
  # depth — and `--redact` keeps the value itself out of the CI log.
  #
  # Like the boundary gate this is deliberately not a dependency of
  # package/docker/release: a leak found in an old commit is a reason to fix the
  # history, not a reason to withhold a jar. `./scripts/check-secrets.sh` uses
  # the gitleaks CLI when one is present and the pinned image otherwise, so the
  # gate accepts the same thing locally and here.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the checkout and its history for committed secrets
        run: ./scripts/check-secrets.sh

  python-backend:
    name: Python liveness backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The runner has a Docker daemon, so the PostgreSQL migration and session
    # persistence tests must run rather than silently skipping themselves.
    env:
      PAD_LIVENESS_REQUIRE_POSTGRES: '1'
    defaults:
      run:
        working-directory: pad_liveness_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12.15
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            pad_liveness_backend/requirements.txt
            pad_liveness_backend/requirements-dev.txt

      - name: Install backend and test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run backend tests (SQLite behavior, OpenCV heuristics, PostgreSQL integration)
        run: python -m pytest --quiet

  # The one check that compares the two implementations instead of asserting
  # each against its own expectations. A spent active-challenge retry budget is
  # driven on the Spring service (real HTTP, real OpenCV) and on the FastAPI
  # backend (its scenario script, run as a subprocess because it is a different
  # runtime), and the terminal verdicts are compared field by field. Each suite
  # on its own can only pin its own spelling, which is how the two backends came
  # to answer `locked` and `reject` for the same policy (CHANGELOG, 2026-10-11).
  cross-backend:
    name: Cross-backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A runner without the Python environment must fail this job rather than
      # skip the comparison inside it — the same convention the Python tests use
      # for PostgreSQL (PAD_LIVENESS_REQUIRE_POSTGRES).
      PAD_LIVENESS_REQUIRE_PYTHON: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python 3.12.15
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: |
            pad_liveness_backend/requirements.txt
            pad_liveness_backend/requirements-dev.txt

      # The scenario runs the real FastAPI app in-process, so it imports the
      # app's own dependencies (FastAPI, SQLAlchemy, numpy, OpenCV) as well as
      # pytest. On PATH as `python3`, which is what the Java test defaults to.
      - name: Install backend dependencies
        run: python -m pip install --requirement pad_liveness_backend/requirements-dev.txt

      - name: Compare a spent retry budget on both backends
        run: ./mvnw --batch-mode test -Dtest='CrossBackendContractTest'

  android-client:
    name: Android/Flutter client build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android_client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The action's `packages` input defaults to 'tools platform-tools', and
      # the `tools` package was removed from the SDK repository years ago, so
      # sdkmanager exits 1 ("Failed to find package 'tools'") before any of the
      # pinned packages below can be installed. Pin it to a package that still
      # exists; the packages this build actually needs are installed next.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          # Explicit, though it is the action's default: the install step below
          # relies on every SDK license already being accepted.
          accept-android-sdk-licenses: 'true'

      # The action already ran `sdkmanager --licenses`, so this step only
      # installs the pinned packages. Its own `yes | sdkmanager --licenses`
      # pipeline is gone on purpose: GitHub's `shell: bash` runs with
      # `-o pipefail`, and `yes` is killed by SIGPIPE the moment sdkmanager
      # finishes accepting, so the step exited 1 on the broken pipe instead of
      # on any SDK error.
      - name: Install pinned Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393"

      - name: Set up Flutter 3.10.4 (Dart 3.0.3)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.10.4'
          cache: true
        env:
          FLUTTER_VERSION: '3.10.4'

      - name: Verify Flutter version
        run: flutter --version

      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Regenerate Pigeon bindings
        run: ./tool/generate_pigeon.sh

      - name: Verify generated bindings are current
        run: git diff --exit-code -- lib/pigeon/liveness.dart android/app/src/main/java/io/mosip/registration/liveness/pigeon/Liveness.java

      - name: Check Dart formatting and analyze
        run: |
          dart format --output=none --set-exit-if-changed lib pigeon
          flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

  # Packages the executable jars only after the Java suites, console guards,
  # and Python backend behavior tests pass, so a red check never publishes an
  # artifact.
  #
  # Two legs, in parallel. The full jar is the deployable artifact — natives
  # for every platform. The slim jar is the same application with only the
  # linux-x86_64 natives a Linux runner can load anyway, which is why it is a
  # fraction of the payload. Building both means storage holds the small one
  # without anyone losing the fully runnable build.
  #
  # Runs on tag pushes too, not only branch pushes: the upload below is what
  # gives a release tag a versioned artifact independent of whichever branch
  # happens to be the default. The release job further down builds both jars
  # itself (stamped with the tag's version) and attaches them, with checksums,
  # to the GitHub Release.
  package:
    name: Package ${{ matrix.artifact }} jar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, console, python-backend]
    strategy:
      # Both legs run to completion — one packaging path failing must not hide
      # the other's result.
      fail-fast: false
      matrix:
        include:
          - artifact: full
            profile: ''
            jar: target/pad-liveness-backend-*.jar
            # The historical name goes to the slim build — it is what CI, the
            # Docker image and most deployments actually run, and it is the
            # small one. The cross-platform jar stays one click away under its
            # own name for macOS/Windows consumers.
            artifact_name: pad-liveness-backend-full-jar
            smoke_jar: full
            # ~200 MiB today; the ceiling leaves ~20% for a patch release but
            # trips the moment a whole extra platform (~50-100 MB) sneaks back.
            max_mib: 245
          # `clean` is not optional for this leg: the slim profile unpacks the
          # kept natives into target/classes, which repackage embeds verbatim,
          # so a non-clean build could leave linux-only natives in the full jar.
          - artifact: slim
            profile: '-Pslim'
            jar: target/pad-liveness-backend-*-slim.jar
            artifact_name: pad-liveness-backend-jar
            smoke_jar: slim
            max_mib: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests already ran in the test jobs, so skip them here; spring-boot
      # repackage turns the build output into the runnable fat jar.
      - name: Package the ${{ matrix.artifact }} jar
        run: ./mvnw --batch-mode clean package -DskipTests ${{ matrix.profile }}

      # Boot the jar we just built and prove it serves traffic. The test jobs
      # run against target/classes with the full ~/.m2 classpath, so nothing
      # they do can catch a packaging-only regression — a fat jar that lost its
      # OpenCV natives, a wrong Start-Class (spring-boot writes JarLauncher
      # itself when a <classifier> is set, and the loader then re-launches until
      # StackOverflowError), a truncated repackage all ship green and only break
      # for whoever runs the artifact.
      #
      # Both legs boot and must report `engine: available`. That is the point
      # of running it for the slim jar too: nothing else in this workflow can
      # tell a working -Pslim build from one whose native filter quietly stopped
      # matching, and that failure ships as a jar that boots fine and then
      # rejects every frame.
      #
      # Deliberately not branch-gated (unlike the upload below): this is the
      # check that makes gating the upload safe to begin with.
      #
      # Lives in a script, not inline, because the release job runs it too and
      # it is runnable locally with ./scripts/smoke-jar.sh (SMOKE_JAR=full|slim).
      - name: Smoke test the packaged jar
        env:
          SMOKE_JAR: ${{ matrix.smoke_jar }}
        run: ./scripts/smoke-jar.sh

      # A jar that outgrows its budget is a regression nobody else notices: the
      # build is still green, every download is just slower, and artifact
      # storage quietly doubles. Red here, on the run that caused it.
      - name: Enforce jar size ceiling
        run: ./scripts/check-jar-size.sh '${{ matrix.jar }}' ${{ matrix.max_mib }} '${{ matrix.artifact }} jar'

      # Both legs report, so the run summary shows the pair on every build and a
      # payload that creeps up over months is visible in the history rather than
      # being discovered when storage fills.
      - name: Report jar size
        run: |
          BYTES=$(wc -c < ${{ matrix.jar }})
          HUMAN=$(numfmt --to=iec --suffix=B "$BYTES" 2>/dev/null || echo "$BYTES bytes")
          {
            echo "### ${{ matrix.artifact }} jar — $HUMAN"
            echo
            echo "Artifact: \`${{ matrix.artifact_name }}\` · budget ${{ matrix.max_mib }} MiB"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishes on the default branch and on v* tags: a versioned artifact
      # must not depend on which branch is the default. Pull requests build
      # both jars but never write to the repo's artifact storage.
      #
      # Two artifact names rather than one shared name: upload-artifact v4
      # treats a name as immutable across jobs, so a second matrix leg
      # uploading under the same name fails with 409 and takes the whole job
      # with it. Each glob matches exactly one file for its leg — the
      # classifier-less fat jar, and the -slim classifier respectively.
      #
      # They are ~210 MB and ~94 MB (bundled OpenCV natives + ONNX model), so
      # retention is kept short to stay inside the artifact storage quota.
      - name: Upload jar
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.jar }}
          if-no-files-found: error
          retention-days: 7

  # The Linux installers are a delivery path of their own: nothing else here
  # builds a .deb, .rpm or AppImage, so a unit installed to the wrong path, a
  # payload that lost the unit, or an AppRun that cannot find the image would
  # ship unseen. `./mvnw package` already produces all three on Linux (pom.xml,
  # linux-package profile) but skips a half whose tool is missing, because a
  # developer without dpkg or rpmbuild still needs a jar. This job passes
  # -Dlinux.package.strict=true so nothing can be skipped, then inspects each
  # archive and boots the AppImage — "the build produced installers" is an
  # assertion, not a log line.
  linux-packages:
    name: Linux packages (.deb + .rpm + AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # jpackage shells out to dpkg-deb and fakeroot for a .deb, and the .rpm is
      # assembled by rpmbuild. The runner image carries none of those promises,
      # so the job installs whatever is missing instead of depending on an image
      # detail.
      - name: Ensure the Linux packaging toolchain
        run: |
          set -euo pipefail
          missing=()
          command -v dpkg-deb >/dev/null 2>&1 || missing+=(dpkg)
          command -v fakeroot  >/dev/null 2>&1 || missing+=(fakeroot)
          command -v rpmbuild  >/dev/null 2>&1 || missing+=(rpm)
          command -v cpio      >/dev/null 2>&1 || missing+=(cpio)
          # The boot gate installs the .deb with dpkg -i, which does not resolve
          # dependencies. xdg-utils is one jpackage declares for the menu entry;
          # apt would pull it, so the job provides what an apt install would.
          command -v xdg-desktop-menu >/dev/null 2>&1 || missing+=(xdg-utils)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      # The packaging script fetches appimagetool 1.9.1 (pinned by version and
      # sha256, because the project's `continuous` tag moves) into this cache on
      # first use. Caching it keeps the job off GitHub's rate limits and makes a
      # re-run reproducible from what was verified the first time.
      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: ~/.cache/pad-liveness/tools
          key: appimagetool-1.9.1-x86_64

      - name: Build the .deb, .rpm and AppImage
        run: ./mvnw --batch-mode clean package -DskipTests -Pslim -Dlinux.package.strict=true

      # SMOKE_UNIT_BOOT installs the .deb the way its README tells a user to and
      # starts the unit, because a sandboxing directive that systemd silently
      # cannot apply — or a StateDirectory the DynamicUser cannot own — passes
      # every contents check and then never answers /health. The runner is a
      # systemd host with passwordless sudo, which is what the script looks for.
      - name: Boot the installers
        env:
          SMOKE_UNIT_BOOT: 1
        run: ./scripts/smoke-linux-packages.sh

      # The boot above runs on this runner's systemd, which is the newest LTS.
      # The hosts the .deb lands on are older, and that is where a directive is
      # dropped without a failure: systemd logs one "Unknown lvalue" line at
      # load time and then runs the unit without that hardening. This boots the
      # unit on the oldest systemd the project supports (Debian 11 / Ubuntu
      # 22.04 in containers, so no VM), and fails if any directive in the unit
      # is not understood there.
      - name: Boot the unit on the oldest supported systemd
        run: ./scripts/smoke-systemd-compat.sh

      # Publishing is the one step with no undo, and it used to be reachable
      # only by pushing a tag at the real repository. The staging, checksum,
      # count and gh code now lives in scripts/release-assets.sh, and this runs
      # its self-test: fixture assets, every guard in the direction that must
      # fail, and the exact gh argv for create, upload and the canary flag —
      # with no tag, no token and no network.
      - name: Rehearse the release publish
        run: ./scripts/release-assets.sh rehearse

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            target/dist/*.deb
            target/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # The launcher is Windows-only, and without this job nothing that ships to a
  # Windows user is ever run: every other job here is ubuntu-latest. Two things
  # hide behind that gap, and both have broken before.
  #
  #   * start.bat itself. Its JDK probe reads `java -version`, which prints on
  #     stderr, through cmd.exe — and cmd strips the quotes around an executable
  #     when a `for /f` command contains a pipe, so a JDK under "C:\Program
  #     Files" was read as the path "C:\Program" and the launcher gave up before
  #     starting anything. A runner's own JDK lives in C:\hostedtoolcache, where
  #     no such thing can happen, so this job installs one under Program Files
  #     on purpose and the smoke script refuses to run against a JDK whose path
  #     has no space. A green run has to mean the quoting path was exercised.
  #   * The full jar's Windows OpenCV natives. scripts/smoke-jar.sh boots the
  #     jar on linux x86_64 and asserts `engine: available`; the same nested
  #     openpnp jar carries a different native for Windows, and nothing loaded
  #     it there.
  #
  # Only the full jar: the slim profile keeps linux/x86_64 natives and nothing
  # else, so on Windows it boots and then reports the engine unavailable by
  # design — its own boot gate is the Linux one in the package job.
  #
  # Not a dependency of package/docker/release, like the boundary and secret
  # gates: a Windows-only regression is a reason to fix the push, not a reason
  # to withhold a jar.
  windows-launcher:
    name: Windows launcher (full jar)
    runs-on: windows-latest
    # A full build on a Windows runner, plus a first boot that extracts the
    # ~65 MB OpenCV native before the service can answer /health.
    timeout-minutes: 45
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # For the Maven cache, not for the JDK: the JDK under test is the one the
      # next step installs, which overwrites this JAVA_HOME. This one sits in
      # C:\hostedtoolcache — a path with no space in it, and therefore exactly
      # what the check below must not be run against.
      - name: Set up JDK 17 (Maven cache only)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Java 21 rather than the 17 the cache-only setup installs, for two
      # reasons: it is a newer major version than this project targets, so the
      # launcher's JDK probe is exercised across a version boundary, and
      # `winget install EclipseAdoptium.Temurin.21.JDK` — the command
      # QUICKSTART hands a Windows reader — is how it arrives on a real machine.
      # That MSI's default INSTALLDIR is C:\Program Files\Eclipse Adoptium, so
      # the path has a space in it without anything faking one.
      - name: Install a JDK under C:\Program Files
        run: |
          choco install temurin21 --yes --no-progress
          $jdk = Get-ChildItem 'C:\Program Files\Eclipse Adoptium' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'jdk-21*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $jdk) {
            throw "no jdk-21* under 'C:\Program Files\Eclipse Adoptium' - this job needs a JDK whose path has a space"
          }
          if ($jdk.FullName -notmatch ' ') {
            throw "$($jdk.FullName) has no space in its path"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "JAVA_HOME=$($jdk.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value "$($jdk.FullName)\bin"
          # `jar --version`, not `java -version`: java prints its banner on
          # stderr, and this shell runs with $ErrorActionPreference = 'Stop',
          # where a redirected native stderr is a terminating error. jar's goes
          # to stdout and reports the same JDK build.
          & "$($jdk.FullName)\bin\jar.exe" --version
          Write-Host "the JDK under test: $($jdk.FullName)"

      # The exact command the packaging job runs, so the artifact is the same
      # one that job would produce; only the platform and the JDK differ.
      - name: Package the full jar
        run: .\mvnw.cmd --batch-mode clean package -DskipTests

      # Boots through the launcher rather than `java -jar`: the JDK probe, the
      # version parse, the port check, the /health wait and the engine report
      # are start.bat's code, and only running it exercises them. The script
      # also asserts the resolved JDK is the one under test, so a launcher that
      # silently fell back to the runner's other JDK would fail rather than pass
      # vacuously. Runnable locally from a Windows checkout with a JDK under a
      # path with a space: ./scripts/smoke-windows-launcher.ps1
      - name: Boot the packaged jar through start.bat
        run: pwsh -NoProfile -File ./scripts/smoke-windows-launcher.ps1

  # The Windows installer is a delivery path of its own: nothing else here
  # builds a .exe, so a launcher packaged without --win-console (a server with
  # no visible log), an installer built from the -Pslim jar (installs, starts,
  # rejects every frame) or a version resource that disagrees with the file name
  # would all ship unseen. `\mvnw.cmd package` already builds it on Windows
  # (pom.xml, windows-package profile), but it skips the .exe when WiX is
  # missing because a developer without the toolchain still needs a jar. This
  # job installs WiX, passes -Dwindows.package.strict=true so nothing can be
  # skipped, and then boots the payload the installer deploys.
  windows-installer:
    name: Windows installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # jpackage builds a .exe by shelling out to WiX 3: candle.exe and light.exe
      # have to be on PATH. Windows runners do not ship it, and jpackage does
      # not support WiX 4/5, so the major is pinned here rather than "latest".
      #
      # The official binaries ZIP, not `choco install wixtoolset`: the package
      # version has already drifted once and its install step fails on the
      # runner before jpackage runs. The ZIP is pinned by URL and checksum, and
      # extracted to RUNNER_TEMP rather than Program Files, so the step needs
      # no elevation and leaves no machine-wide state behind.
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "WiX ZIP checksum $actual does not match the pinned $expected"
          }

          $wix = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive -LiteralPath $zip -DestinationPath $wix -Force
          foreach ($tool in @('candle.exe', 'light.exe')) {
            if (-not (Test-Path (Join-Path $wix $tool))) {
              throw "$tool is not under $wix - jpackage cannot build a .exe"
            }
          }
          Write-Host "WiX $((Get-Item (Join-Path $wix 'candle.exe')).VersionInfo.ProductVersion) at $wix"
          Add-Content -Path $env:GITHUB_PATH -Value $wix

      # The interface a developer uses, with the strict switch the profile
      # documents: what this job builds is what `\mvnw.cmd package` builds.
      # No -Pslim: the slim jar keeps linux/x86_64 natives, so an installer
      # built from it would install and then reject every frame.
      - name: Build the jar and the .exe installer
        shell: pwsh
        run: |
          $mvn = @('--batch-mode', 'clean', 'package', '-DskipTests', '-Dwindows.package.strict=true')
          # A tag is the version, exactly as in the release job: without this the
          # .exe is built as 1.0.0-SNAPSHOT and cannot be attached to the tag.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $mvn += "-Drevision=$($env:GITHUB_REF_NAME.Substring(1))"
          }
          & .\mvnw.cmd @mvn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Asserts the installer is a PE image with a version resource matching its
      # name, then boots the application image it deploys and probes /health for
      # `engine: available` and the console for text/html. The installer's own
      # interactive install/uninstall is not automated.
      - name: Boot the payload the installer deploys
        run: pwsh -NoProfile -File ./scripts/smoke-windows-installer.ps1

      # Branch-gated like the jars: a pull request builds and boots the
      # installer but writes nothing to artifact storage.
      - name: Upload the installer
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: target/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  # The .exe is built on Windows, but the release is created on Ubuntu by the
  # release job. This bridge waits for both, downloads the built installer and
  # appends it to the release with a sibling checksum. It is deliberately not
  # part of release-assets.sh: that script stages the Maven build's assets, and
  # a Windows packaging failure must not stop the jars and Linux installers from
  # shipping (the same reason the Android APK is a separate job).
  #
  # jpackage strips a prerelease suffix from --app-version, so the built file is
  # `pad-liveness-<numeric>.exe` even for a canary tag. That name is asserted
  # before the asset is renamed to the full tag version, which keeps two canaries
  # from publishing the same file name.
  windows-installer-release:
    name: Publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [release, windows-installer]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Download the Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: installer

      - name: Name and checksum the installer
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(installer/*.exe)
          if [ "${#exes[@]}" -ne 1 ]; then
            echo "::error::expected one .exe in the windows-installer artifact, found ${#exes[@]}"
            ls -la installer || true
            exit 1
          fi
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          BUILT="$(basename "${exes[0]}")"
          if [ "$BUILT" != "pad-liveness-$CORE.exe" ]; then
            echo "::error::jpackage produced $BUILT, expected pad-liveness-$CORE.exe for $TAG"
            exit 1
          fi
          ASSET="pad-liveness-$VERSION.exe"
          cp "${exes[0]}" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # The image is a separate delivery path from the jar: the Dockerfile's COPY,
  # its Alpine base, the unprivileged user and the JVM flags exist nowhere else
  # in this repository, so no other job can see a mistake in any of them. Builds
  # from the slim profile and boots the container against /health.
  #
  # It packages its own slim jar rather than downloading the package job's
  # artifact: that upload is deliberately branch-gated, so on a pull request
  # there would be nothing to download and the check would silently skip.
  #
  # The container assertion is `status: ok`, not `engine: available` — Alpine is
  # musl and the OpenCV native is glibc-linked, so a correct image serves the API
  # with frame processing unavailable by design. The engine assertion lives in
  # the jar smoke tests, which run on glibc.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, python-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package the slim jar the image is built from
        run: ./mvnw --batch-mode clean package -DskipTests -Pslim

      - name: Build the image and smoke test the container
        run: ./scripts/smoke-docker.sh

  # Boot-time gate: the packaged jar booted N times, each from a
  # *cold* OpenCV native cache, with the median time-to-/health
  # reported to the step summary and a generous budget enforced.
  #
  # Nothing else in this workflow notices a slow boot. The smoke test
  # proves the jar *can* boot; a new eager bean, an extra Flyway
  # migration or a dependency that scans the classpath at startup all
  # ship green and surface only as "deployments are slow now". The
  # native cache is cleared before every boot because openpnp extracts
  # the ~65 MB OpenCV native once per machine — without that, boots
  # 2..N would reuse the cache and measure the warm case, while the
  # case a fresh deployment (or a fresh runner) actually hits is cold.
  #
  # The budget is ~3x the measured ~43 s on purpose: this gate exists
  # to catch a regression that doubles boot, not to shave seconds.
  #
  # Builds its own jar rather than downloading the package job's
  # artifact: that upload is branch-gated, so on a pull request there
  # would be nothing to download (same reasoning as the docker job).
  # Slim because that is what CI, the Docker image and most deployments
  # actually run; BOOT_MEDIAN_JAR=full measures the full jar instead.
  #
  # Lives in a script, not inline, so it is runnable locally with
  # ./scripts/boot-median.sh (BOOT_MEDIAN_JAR=full|slim).
  boot-time:
    name: Cold boot time (median)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, console, python-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package the slim jar to measure
        run: ./mvnw --batch-mode clean package -DskipTests -Pslim

      - name: Measure median cold boot time
        env:
          BOOT_MEDIAN_RUNS: '5'
          BOOT_MEDIAN_MAX_SECONDS: '120'
        run: ./scripts/boot-median.sh

  # The schema gate — the only job that compares the entities against the Flyway
  # migrations on the database that actually ships.
  #
  # Everything else in this workflow runs on H2 with ddl-auto: create-drop, so
  # Hibernate builds the schema *from the entities* and Flyway never runs. That
  # hides a whole class of drift: a column an entity declares but no migration
  # creates, a column too narrow for the values, an enum stored as a number.
  # Green CI, broken production — while production is PostgreSQL, the one
  # database never exercised.
  #
  # The test owns an isolated PostgreSQL through Testcontainers, so the same
  # schema gate runs locally and in CI without environment-specific setup.
  # It runs in parallel with the suites rather than after them — it is an
  # independent concern and gives a fast signal.
  schema:
    name: PostgreSQL schema gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate migrations against the entities
        run: ./mvnw --batch-mode test -Dtest='PostgresSchemaTest'

  # Pushing a version tag (v*) publishes a GitHub Release. This is
  # the deliberate, human-initiated publish event — unlike the per-push artifact
  # upload, which is ephemeral and branch-gated.
  #
  # BOTH jars are release assets: the full one is the deployable
  # cross-platform build, and the slim one is what CI, the Docker image and
  # most deployments actually run — at a fifth of the size it is what most
  # downloaders want. Each ships with a sibling .sha256 so a download can be
  # verified before it is trusted.
  #
  # The Linux installers ride along, from the same slim build that produces the
  # slim jar: the .deb is what a Debian/Ubuntu host installs, the .rpm does the
  # same for Fedora/RHEL, and the AppImage needs no root at all, so a release
  # that carried only jars left the artifacts people actually install to be
  # rebuilt by hand or downloaded from ephemeral CI artifact storage that
  # expires in a week. They go through the same gate as the jars — built with
  # -Dlinux.package.strict=true so no half can be skipped, inspected and booted
  # by scripts/smoke-linux-packages.sh, and shipped with their own .sha256 —
  # because a release is the one place an unverified artifact reaches a user.
  #
  # A `-canary` tag (e.g. v1.1.0-canary.1) runs the identical pipeline —
  # both jars, all three Linux installers, every check and checksum — but
  # publishes as a prerelease, so a canary is visible and installable without
  # ever being the version GitHub surfaces as "the latest". The pattern is
  # matched on the tag name below.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Two full builds, two jar boots and an AppImage boot, so more than the
    # package job's budget.
    timeout-minutes: 45
    needs: [test, python-backend]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Scoped to this job alone: the rest of the workflow stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # jpackage shells out to dpkg-deb and fakeroot for the .deb, and rpmbuild
      # assembles the .rpm. The runner image carries neither promise, but the
      # release installs whatever is missing rather than depending on an image
      # detail — with -Dlinux.package.strict=true a missing tool is a failed
      # release, and the point is to fail on a broken package, not on an image
      # that changed.
      - name: Ensure the Linux packaging toolchain
        run: |
          set -euo pipefail
          missing=()
          command -v dpkg-deb >/dev/null 2>&1 || missing+=(dpkg)
          command -v fakeroot  >/dev/null 2>&1 || missing+=(fakeroot)
          command -v rpmbuild  >/dev/null 2>&1 || missing+=(rpm)
          command -v cpio      >/dev/null 2>&1 || missing+=(cpio)
          # The boot gate installs the .deb with dpkg -i, which does not resolve
          # dependencies. xdg-utils is one jpackage declares for the menu entry;
          # apt would pull it, so the job provides what an apt install would.
          command -v xdg-desktop-menu >/dev/null 2>&1 || missing+=(xdg-utils)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      # Same cache and key as the Linux packages job: appimagetool is fetched
      # once from its pinned 1.9.1 release (verified against a hard-coded
      # sha256) instead of on every release, which keeps a publish off GitHub's
      # rate limits and reproducible from what was verified the first time.
      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: ~/.cache/pad-liveness/tools
          key: appimagetool-1.9.1-x86_64

      # Release assets are the same artifact CI publishes elsewhere, so they go
      # through the identical gate: green tests, then a real boot.
      #
      # The tag is the version: `v1.0.1` builds as 1.0.1, so the jar's
      # manifest and file name — and therefore the release asset — match
      # the release instead of reading 1.0.0-SNAPSHOT. `${revision}` is
      # the pom's CI-friendly version property; every other build keeps
      # the snapshot default. The assertions below exist because a failed
      # stamp is otherwise silent: the build still succeeds and publishes
      # a SNAPSHOT-named asset.
      #
      # Both jars are built here rather than downloaded from the package job:
      # those were built without the tag's revision, and a release must not
      # ship assets whose name and manifest carry a snapshot version.
      #
      # -Dlinux.package.skip=true because this is the full-jar build: the
      # installers are made once, from the slim jar below, and the profile would
      # otherwise spend minutes packaging a ~200 MB app image that the next
      # `clean` deletes.
      - name: Package the full jar (version stamped from the tag)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          ./mvnw --batch-mode -DskipTests -Drevision="$VERSION" \
            -Dlinux.package.skip=true package

          JAR="target/pad-liveness-backend-$VERSION.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::expected $JAR — the tag version was not stamped into the build"
            exit 1
          fi
          MANIFEST_VERSION=$(unzip -p "$JAR" META-INF/MANIFEST.MF \
            | sed -n 's/^Implementation-Version: //p' | tr -d '\r')
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest reports '$MANIFEST_VERSION', expected '$VERSION'"
            exit 1
          fi
          echo "stamped $TAG as $VERSION (manifest Implementation-Version: $MANIFEST_VERSION)"

      # The boot gate, before anything is published. On success the jar is
      # staged into release-assets/ — the slim build below starts with
      # `clean`, which deletes everything in target/ including this jar.
      - name: Smoke test the full jar
        env:
          SMOKE_JAR: full
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          ./scripts/smoke-jar.sh
          VERSION="${TAG#v}"
          ./scripts/release-assets.sh add --version "$VERSION" \
            "target/pad-liveness-backend-$VERSION.jar"

      # Same gate for the slim asset. `clean` is not optional for this build:
      # the slim profile unpacks the kept natives into target/classes, which
      # repackage embeds verbatim, so a target/ left over from the full build
      # could leak the wrong natives into the slim artifact (see pom.xml).
      #
      # The Linux installers are built by this same invocation: the pom's
      # linux-package profile runs scripts/package-linux.sh from the `package`
      # phase, and package-linux.sh prefers the slim jar, so the .deb, .rpm and
      # AppImage carry exactly the artifact this step just stamped. Strict mode
      # is what makes that an assertion: without it a missing dpkg, rpmbuild or
      # appimagetool would skip a half and still exit 0, publishing a release
      # with an installer that is not there.
      - name: Package the slim jar and the Linux installers (version stamped from the tag)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          # jpackage rejects a prerelease suffix, so package-linux.sh builds the
          # installers as the numeric core: 1.0.4-canary.2 -> 1.0.4. The jars
          # keep the full tag version; the installer assertions below use CORE.
          CORE="${VERSION%%-*}"
          ./mvnw --batch-mode -DskipTests -Drevision="$VERSION" \
            clean package -Pslim -Dlinux.package.strict=true

          JAR="target/pad-liveness-backend-$VERSION-slim.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::expected $JAR — the tag version was not stamped into the slim build"
            exit 1
          fi
          MANIFEST_VERSION=$(unzip -p "$JAR" META-INF/MANIFEST.MF \
            | sed -n 's/^Implementation-Version: //p' | tr -d '\r')
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::slim jar manifest reports '$MANIFEST_VERSION', expected '$VERSION'"
            exit 1
          fi
          echo "stamped $TAG as $VERSION (slim manifest Implementation-Version: $MANIFEST_VERSION)"

          # One of each, carrying the tag's version. A stale target/dist from a
          # previous build would otherwise publish an installer of an older
          # version under this release's name.
          shopt -s nullglob
          DEBS=( target/dist/*.deb )
          RPMS=( target/dist/*.rpm )
          APPIMAGES=( target/dist/*.AppImage )
          shopt -u nullglob
          if [ "${#DEBS[@]}" -ne 1 ] || [ "${#RPMS[@]}" -ne 1 ] || [ "${#APPIMAGES[@]}" -ne 1 ]; then
            echo "::error::expected one .deb, one .rpm and one AppImage in target/dist, found ${#DEBS[@]}, ${#RPMS[@]} and ${#APPIMAGES[@]}"
            ls -la target/dist 2>/dev/null || true
            exit 1
          fi
          case "$(basename "${DEBS[0]}")" in
            *"$CORE"*) ;;
            *) echo "::error::${DEBS[0]} does not carry $CORE"; exit 1 ;;
          esac
          case "$(basename "${RPMS[0]}")" in
            *"$CORE"*) ;;
            *) echo "::error::${RPMS[0]} does not carry $CORE"; exit 1 ;;
          esac
          case "$(basename "${APPIMAGES[0]}")" in
            *"$CORE"*) ;;
            *) echo "::error::${APPIMAGES[0]} does not carry $CORE"; exit 1 ;;
          esac
          DEB_VERSION=$(dpkg-deb -f "${DEBS[0]}" Version)
          case "$DEB_VERSION" in
            "$CORE"|"$CORE"-*) ;;
            *) echo "::error::${DEBS[0]} declares Version $DEB_VERSION, expected $CORE"; exit 1 ;;
          esac
          RPM_VERSION=$(rpm -qp --qf '%{VERSION}' "${RPMS[0]}")
          if [ "$RPM_VERSION" != "$CORE" ]; then
            echo "::error::${RPMS[0]} declares Version $RPM_VERSION, expected $CORE"
            exit 1
          fi
          echo "installers: $(basename "${DEBS[0]}") (Version $DEB_VERSION), $(basename "${RPMS[0]}") (Version $RPM_VERSION), $(basename "${APPIMAGES[0]}")"

      - name: Smoke test the slim jar
        env:
          SMOKE_JAR: slim
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          ./scripts/smoke-jar.sh
          VERSION="${TAG#v}"
          ./scripts/release-assets.sh add --version "$VERSION" \
            "target/pad-liveness-backend-$VERSION-slim.jar"

      # The installers are release assets too, and the same rule applies: an
      # artifact that only exists because the build said so is not evidence it
      # works. This is the Linux packages job's gate, run on the exact files
      # this release would publish — the .deb and .rpm payloads, then the
      # AppImage against /health and the console. A broken installer now fails
      # the tag build instead of being replaced quietly by a re-run.
      - name: Smoke test the Linux installers
        env:
          SMOKE_UNIT_BOOT: 1
        run: ./scripts/smoke-linux-packages.sh

      # Staged before the checksums because target/ is the build's scratch
      # space, and a second build in this job must not be able to lose them.
      - name: Stage the Linux installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          VERSION="${TAG#v}"
          # The installers carry the numeric core jpackage accepts, not the tag's
          # prerelease suffix; the jars above carry the full version.
          ./scripts/release-assets.sh add --version "${VERSION%%-*}" \
            target/dist/*.deb target/dist/*.rpm target/dist/*.AppImage

      # One checksum per asset, named exactly like its file with a .sha256
      # suffix — the convention `sha256sum -c <file>.sha256` verifies from
      # the download directory with no path editing. The check run here
      # proves the files are well-formed before they are published.
      - name: Generate checksums for the release assets
        run: ./scripts/release-assets.sh checksums

      # `gh release create` fails if the release already exists, which is what a
      # re-pushed or moved tag looks like. Upload --clobber replaces the assets
      # in that case, so a retried run converges instead of wedging. GH_TOKEN is
      # the automatic per-run token, so there is no secret to configure or leak.
      #
      # A `-canary` tag publishes as a prerelease: same smoke gate, same assets,
      # but flagged so nobody treats an untested-in-production build as the
      # latest stable version. The flag is set at create time; gh has no option
      # to flip it on upload, so an existing canary release keeps whatever flag
      # it was created with — a re-run replaces the assets, which is the point.
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The count, the stamped jar names, the create-vs-upload branch and the
        # canary flag live in scripts/release-assets.sh, so the rehearsal in the
        # Linux packages job runs the same code this tag build runs.
        run: ./scripts/release-assets.sh attach --tag "$TAG"

  # Publishes the Android integration harness as an installable APK beside the
  # desktop installers.
  #
  # This is *not* a service installer and not the MOSIP Registration Client:
  # android_client/ is a build harness whose session starts fail-closed until a
  # host supplies the native liveness API and camera pipeline. It installs and
  # opens on an Android device, which is useful to a host integrator, so it is
  # labelled as a harness in the asset name and in android_client/README.md.
  #
  # A separate job, not part of release-assets.sh: the APK comes from the
  # Flutter toolchain rather than the Maven build, and coupling the desktop
  # release job to an Android SDK would make a JVM packaging failure and an
  # Android build failure indistinguishable. `needs: release` keeps it off the
  # critical path: a broken APK cannot stop the jars and installers shipping.
  android-harness-release:
    name: Publish Android harness APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      # Same pinned packages as the Android client job, because the Gradle
      # module pins compileSdk/build-tools/NDK and refuses to infer them.
      - name: Install pinned Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393"

      - name: Set up Flutter 3.10.4 (Dart 3.0.3)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.10.4'
          cache: true

      - name: Resolve locked Dart dependencies
        working-directory: android_client
        run: flutter pub get --enforce-lockfile

      # --build-name carries the release version into the APK, so an installed
      # harness reports the same version as the tag it came from. The release
      # build is signed with the debug key (android/app/build.gradle), which is
      # installable but not a store-ready signature; the README says so.
      - name: Build the release APK
        working-directory: android_client
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Name and checksum the harness APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APK="pad-liveness-android-harness-$VERSION.apk"
          cp "android_client/build/app/outputs/flutter-apk/app-release.apk" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Attach the harness APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$APK" "$APK.sha256" --clobber

  # Publishes the Docker image for a release tag. The jar ships as a
  # release asset (job above); this makes the container delivery path
  # carry the same tag, so a version ships both ways at once and a
  # deployment can pick either artifact at the same version.
  #
  # Needs the release job, not just test: "promotes a successful
  # release" means the release — jars, checksums and all — exists
  # before an image is published under its tag. A release that failed
  # to publish must not have an image claiming the same version.
  #
  # Canaries ride along: a v1.1.0-canary.1 tag publishes a
  # v1.1.0-canary.1 image, matching the prerelease it belongs to.
  docker-release:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      # Pushing to ghcr.io is a package write; the release job's
      # contents: write is deliberately not inherited here.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Same build the release job's slim asset went through, so the
      # image contains a jar stamped with the release version rather
      # than a snapshot.
      - name: Package the slim jar the image is built from
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          ./mvnw --batch-mode -DskipTests -Drevision="${TAG#v}" clean package -Pslim

      # The smoke script builds the image, boots it, and asserts /health
      # and the non-root user — so the image that gets pushed is exactly
      # the one that passed the gate. SMOKE_IMAGE names the target:
      # ghcr.io/<owner>/<repo>:<release-tag>, lowercased because GHCR
      # rejects uppercase repository names.
      - name: Build, smoke test and publish the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          SMOKE_IMAGE="$IMAGE" ./scripts/smoke-docker.sh
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          echo "published $IMAGE"
