spring:
  # ---- H2 in-memory database for local dev (replaces Postgres for quick start) ----
  datasource:
    url: jdbc:h2:mem:pad_liveness;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console
